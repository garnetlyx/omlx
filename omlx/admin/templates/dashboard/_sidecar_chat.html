<div class="bg-white rounded-2xl border border-neutral-200 overflow-hidden mb-8">
    <div class="flex items-center justify-between px-6 py-4 bg-neutral-100 border-b border-neutral-200">
        <div class="flex items-center gap-3">
            <i data-lucide="message-square" class="w-4 h-4 text-neutral-500"></i>
            <span class="text-xs font-bold uppercase tracking-wider text-neutral-600">{{ t('status.sidecar_chat.section_label') }}</span>
        </div>
        <div class="flex items-center gap-2">
            <select x-model="sidecarChat.selectedModel"
                    :disabled="sidecarChat.models.length === 0 || sidecarChat.loading"
                    class="text-xs font-mono bg-white border border-neutral-300 rounded-md px-2 py-1 text-neutral-700 focus:outline-none focus:ring-2 focus:ring-neutral-400 disabled:opacity-50">
                <template x-if="sidecarChat.models.length === 0">
                    <option value="">{{ t('status.sidecar_chat.no_models') }}</option>
                </template>
                <template x-for="m in sidecarChat.models" :key="m">
                    <option :value="m" x-text="m"></option>
                </template>
            </select>
            <button x-show="sidecarChat.messages.length > 0"
                    @click="clearSidecarChat()"
                    class="p-1 text-neutral-400 hover:text-red-500 hover:bg-neutral-200 rounded-lg transition-all"
                    :title="window.t('status.sidecar_chat.clear_tooltip')">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </div>
    <div class="px-6 py-5 space-y-4">
        <div x-show="sidecarChat.configError" x-cloak
             class="flex items-center gap-2 px-3 py-2.5 bg-red-50 border border-red-200 rounded-lg text-xs text-red-600">
            <i data-lucide="alert-triangle" class="w-3.5 h-3.5 flex-shrink-0"></i>
            <span x-text="sidecarChat.configError"></span>
        </div>

        <div class="border border-neutral-100 rounded-xl bg-neutral-50/50 p-3 space-y-3 max-h-96 overflow-y-auto">
            <div x-show="sidecarChat.messages.length === 0" x-cloak
                 class="text-center text-xs text-neutral-400 py-8">
                {{ t('status.sidecar_chat.empty') }}
            </div>
            <template x-for="(msg, idx) in sidecarChat.messages" :key="idx">
                <div class="flex" :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
                    <div class="max-w-[80%] px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words"
                         :class="msg.role === 'user' ? 'bg-neutral-900 text-white rounded-br-sm' : 'bg-white border border-neutral-200 text-neutral-800 rounded-bl-sm'"
                         x-text="msg.content"></div>
                </div>
            </template>
            <div x-show="sidecarChat.loading" x-cloak class="flex justify-start">
                <div class="px-3 py-2 rounded-2xl rounded-bl-sm bg-white border border-neutral-200 text-neutral-400 text-sm flex items-center gap-2">
                    <svg class="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    <span>{{ t('status.sidecar_chat.thinking') }}</span>
                </div>
            </div>
        </div>

        <div x-show="sidecarChat.error" x-cloak
             class="flex items-center gap-2 px-3 py-2.5 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-700">
            <i data-lucide="alert-triangle" class="w-3.5 h-3.5 flex-shrink-0"></i>
            <span x-text="sidecarChat.error"></span>
        </div>

        <div class="flex items-end gap-2">
            <textarea x-model="sidecarChat.input"
                      @keydown.enter.exact.prevent="sendSidecarChat()"
                      :disabled="sidecarChat.loading"
                      rows="2"
                      :placeholder="window.t('status.sidecar_chat.placeholder')"
                      class="flex-1 px-3 py-2 text-sm border border-neutral-200 rounded-lg bg-white focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900 transition-all resize-none disabled:opacity-50"></textarea>
            <button @click="sendSidecarChat()"
                    :disabled="sidecarChat.loading || !sidecarChat.input.trim()"
                    class="px-4 py-2.5 text-sm font-medium text-white bg-neutral-900 rounded-lg hover:bg-neutral-800 disabled:opacity-40 transition-all flex items-center gap-2">
                <i data-lucide="send" class="w-3.5 h-3.5"></i>
                <span>{{ t('status.sidecar_chat.send') }}</span>
            </button>
        </div>
    </div>
</div>
